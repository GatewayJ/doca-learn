<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">CPU-centric and GPU-centric network paths</title>
  <desc id="desc">CPU-centric networking requires the CPU to observe completion and notify each GPU batch. GPU-centric networking lets the CUDA kernel control the NIC data path after CPU initialization.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1e293b; }
      .title { font-size: 22px; font-weight: 700; }
      .head { font-size: 18px; font-weight: 700; }
      .label { font-size: 16px; font-weight: 650; }
      .small { font-size: 14px; fill: #475569; }
      .box { stroke-width: 2; rx: 14; }
      .line { stroke: #475569; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .control { stroke: #f97316; stroke-dasharray: 8 7; }
      .data { stroke: #10b981; stroke-width: 4; }
    </style>
  </defs>
  <rect width="1200" height="500" fill="#f8fafc" rx="18"/>
  <text x="600" y="38" text-anchor="middle" class="title">GPUDirect data placement vs. GPUNetIO GPU-initiated control</text>

  <rect x="35" y="70" width="540" height="380" fill="#fff7ed" stroke="#fb923c" stroke-width="2" rx="18"/>
  <text x="305" y="105" text-anchor="middle" class="head">CPU-centric GPUDirect RDMA</text>
  <rect x="80" y="145" width="140" height="80" class="box" fill="#ffffff" stroke="#f97316"/>
  <text x="150" y="180" text-anchor="middle" class="label">NIC</text>
  <text x="150" y="202" text-anchor="middle" class="small">queue + DMA</text>
  <rect x="385" y="145" width="140" height="80" class="box" fill="#ffffff" stroke="#8b5cf6"/>
  <text x="455" y="180" text-anchor="middle" class="label">GPU memory</text>
  <text x="455" y="202" text-anchor="middle" class="small">packet batch</text>
  <rect x="230" y="305" width="150" height="80" class="box" fill="#ffffff" stroke="#3b82f6"/>
  <text x="305" y="340" text-anchor="middle" class="label">CPU</text>
  <text x="305" y="362" text-anchor="middle" class="small">progress + notify</text>
  <path d="M220 185 H385" class="line data"/>
  <text x="303" y="169" text-anchor="middle" class="small">direct data</text>
  <path d="M260 305 C215 275 175 260 160 225" class="line control"/>
  <path d="M350 305 C395 275 435 260 445 225" class="line control"/>
  <text x="305" y="275" text-anchor="middle" class="small">CPU remains in each-batch critical path</text>

  <rect x="625" y="70" width="540" height="380" fill="#ecfdf5" stroke="#34d399" stroke-width="2" rx="18"/>
  <text x="895" y="105" text-anchor="middle" class="head">GPUNetIO GPU-centric path</text>
  <rect x="670" y="145" width="140" height="80" class="box" fill="#ffffff" stroke="#10b981"/>
  <text x="740" y="180" text-anchor="middle" class="label">NIC</text>
  <text x="740" y="202" text-anchor="middle" class="small">Rx/Tx/RDMA/DMA</text>
  <rect x="960" y="145" width="170" height="80" class="box" fill="#ffffff" stroke="#8b5cf6"/>
  <text x="1045" y="180" text-anchor="middle" class="label">CUDA kernel</text>
  <text x="1045" y="202" text-anchor="middle" class="small">receive · process · send</text>
  <rect x="820" y="305" width="150" height="80" class="box" fill="#ffffff" stroke="#3b82f6"/>
  <text x="895" y="340" text-anchor="middle" class="label">CPU</text>
  <text x="895" y="362" text-anchor="middle" class="small">setup + recovery</text>
  <path d="M810 185 H960" class="line data"/>
  <path d="M960 210 H810" class="line data"/>
  <text x="885" y="135" text-anchor="middle" class="small">GPU↔NIC hot path</text>
  <path d="M860 305 C815 275 770 260 750 225" class="line control"/>
  <path d="M930 305 C980 275 1020 260 1035 225" class="line control"/>
  <text x="895" y="275" text-anchor="middle" class="small">CPU configures once, then monitors</text>
</svg>
