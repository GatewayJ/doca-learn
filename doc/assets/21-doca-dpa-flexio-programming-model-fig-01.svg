<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">DPA control plane, execution plane, and NIC data path</title>
  <desc id="desc">A host or DPU control process loads a DPA program and manages resources. DPA handlers consume NIC events and operate queues close to NIC engines.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1e293b; }
      .title { font-size: 22px; font-weight: 700; }
      .label { font-size: 17px; font-weight: 650; }
      .small { font-size: 14px; fill: #475569; }
      .box { stroke-width: 2; rx: 14; }
      .line { stroke: #475569; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .dash { stroke-dasharray: 8 7; }
    </style>
  </defs>
  <rect width="1200" height="500" fill="#f8fafc" rx="18"/>
  <text x="600" y="38" text-anchor="middle" class="title">DPA: CPU-managed control, event-driven execution near the NIC</text>

  <rect x="45" y="85" width="300" height="325" class="box" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="195" y="120" text-anchor="middle" class="label">Host CPU or DPU ARM</text>
  <rect x="80" y="150" width="230" height="72" class="box" fill="#ffffff" stroke="#93c5fd"/>
  <text x="195" y="179" text-anchor="middle" class="label">Control process</text>
  <text x="195" y="202" text-anchor="middle" class="small">DOCA DPA / FlexIO runtime</text>
  <rect x="80" y="252" width="230" height="112" class="box" fill="#ffffff" stroke="#93c5fd"/>
  <text x="195" y="281" text-anchor="middle" class="label">Owns lifecycle</text>
  <text x="195" y="307" text-anchor="middle" class="small">device · memory · queues</text>
  <text x="195" y="330" text-anchor="middle" class="small">events · load · teardown</text>

  <rect x="450" y="85" width="300" height="325" class="box" fill="#f5f3ff" stroke="#8b5cf6"/>
  <text x="600" y="120" text-anchor="middle" class="label">DPA subsystem</text>
  <rect x="485" y="150" width="230" height="72" class="box" fill="#ffffff" stroke="#c4b5fd"/>
  <text x="600" y="179" text-anchor="middle" class="label">DPA process</text>
  <text x="600" y="202" text-anchor="middle" class="small">DPACC-built application</text>
  <rect x="485" y="252" width="230" height="112" class="box" fill="#ffffff" stroke="#c4b5fd"/>
  <text x="600" y="281" text-anchor="middle" class="label">Handler / thread</text>
  <text x="600" y="307" text-anchor="middle" class="small">bounded batch · state</text>
  <text x="600" y="330" text-anchor="middle" class="small">reschedule · re-arm</text>

  <rect x="855" y="85" width="300" height="325" class="box" fill="#ecfdf5" stroke="#10b981"/>
  <text x="1005" y="120" text-anchor="middle" class="label">NIC engines and queues</text>
  <rect x="890" y="150" width="230" height="72" class="box" fill="#ffffff" stroke="#6ee7b7"/>
  <text x="1005" y="179" text-anchor="middle" class="label">CQ / RQ / SQ</text>
  <text x="1005" y="202" text-anchor="middle" class="small">completion and descriptors</text>
  <rect x="890" y="252" width="230" height="112" class="box" fill="#ffffff" stroke="#6ee7b7"/>
  <text x="1005" y="281" text-anchor="middle" class="label">Hardware work</text>
  <text x="1005" y="307" text-anchor="middle" class="small">Ethernet · DMA · RDMA</text>
  <text x="1005" y="330" text-anchor="middle" class="small">doorbell · completion</text>

  <path d="M310 186 H485" class="line"/>
  <text x="397" y="170" text-anchor="middle" class="small">load / configure / RPC</text>
  <path d="M715 186 H890" class="line dash"/>
  <text x="802" y="170" text-anchor="middle" class="small">queue handles / context</text>
  <path d="M890 308 H715" class="line"/>
  <text x="802" y="292" text-anchor="middle" class="small">CQE / event</text>
  <path d="M715 344 H890" class="line"/>
  <text x="802" y="371" text-anchor="middle" class="small">queue operation</text>
  <text x="600" y="455" text-anchor="middle" class="small">The DPA is not a standalone CPU: the control process owns its resources and lifetime.</text>
</svg>
