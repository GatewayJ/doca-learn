<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">GPUNetIO Ethernet packet pipeline</title>
  <desc id="desc">DOCA Flow steers packets into Ethernet receive queues backed by GPU memory. CUDA kernels receive, process, and enqueue packets for transmission.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1e293b; }
      .title { font-size: 22px; font-weight: 700; }
      .label { font-size: 16px; font-weight: 650; }
      .small { font-size: 14px; fill: #475569; }
      .box { stroke-width: 2; rx: 14; }
      .line { stroke: #475569; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="420" fill="#f8fafc" rx="18"/>
  <text x="600" y="42" text-anchor="middle" class="title">GPUNetIO Ethernet: steering, queueing, GPU processing, and ownership</text>

  <rect x="35" y="110" width="150" height="90" class="box" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="110" y="147" text-anchor="middle" class="label">Ingress port</text>
  <text x="110" y="173" text-anchor="middle" class="small">wire packets</text>

  <rect x="235" y="110" width="160" height="90" class="box" fill="#ecfdf5" stroke="#10b981"/>
  <text x="315" y="147" text-anchor="middle" class="label">DOCA Flow</text>
  <text x="315" y="173" text-anchor="middle" class="small">match + RSS</text>

  <rect x="445" y="110" width="160" height="90" class="box" fill="#ecfdf5" stroke="#10b981"/>
  <text x="525" y="147" text-anchor="middle" class="label">Ethernet RxQ</text>
  <text x="525" y="173" text-anchor="middle" class="small">NIC writes buffers</text>

  <rect x="655" y="90" width="190" height="130" class="box" fill="#f5f3ff" stroke="#8b5cf6"/>
  <text x="750" y="128" text-anchor="middle" class="label">CUDA pipeline</text>
  <text x="750" y="157" text-anchor="middle" class="small">receive → parse → compute</text>
  <text x="750" y="184" text-anchor="middle" class="small">semaphore / backpressure</text>

  <rect x="895" y="110" width="145" height="90" class="box" fill="#ecfdf5" stroke="#10b981"/>
  <text x="967" y="147" text-anchor="middle" class="label">Ethernet TxQ</text>
  <text x="967" y="173" text-anchor="middle" class="small">commit + push</text>

  <rect x="1080" y="110" width="85" height="90" class="box" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="1122" y="147" text-anchor="middle" class="label">Wire</text>
  <text x="1122" y="173" text-anchor="middle" class="small">Tx</text>

  <path d="M185 155 H235" class="line"/>
  <path d="M395 155 H445" class="line"/>
  <path d="M605 155 H655" class="line"/>
  <path d="M845 155 H895" class="line"/>
  <path d="M1040 155 H1080" class="line"/>

  <rect x="235" y="290" width="805" height="75" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="637" y="320" text-anchor="middle" class="label">Packet buffer ownership</text>
  <text x="637" y="347" text-anchor="middle" class="small">FREE → NIC_OWNED → GPU_RX → GPU_PROCESSING → GPU_TX → FREE</text>
  <path d="M525 200 V290" class="line"/>
  <path d="M967 290 V200" class="line"/>
</svg>
